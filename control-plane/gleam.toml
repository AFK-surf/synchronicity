gleam_json = ">= 2.0.0 and < 4.0.0"
gleam_http = ">= 3.7.0 and < 5.0.0"
gleam_httpc = ">= 3.0.0 and < 6.0.0"
wisp = ">= 1.5.0 and < 3.0.0"
mist = ">= 4.0.0 and < 7.0.0"
glisten = ">= 7.0.0 and < 10.0.0"
thirtytwo = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
exception = ">= 2.0.0 and < 3.0.0"
gen_smtp = ">= 1.2.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
