\* The partitioned cluster: the quiesce may elapse without reaching the
\* peer that holds the newest pre-loss history, and a publish may happen
\* before any summary arrives.  NoObservableFork MUST FAIL here — the
\* counterexample is the fork §3.4 documents and accepts.  CI runs this
\* config expecting a violation: if it ever passes, the model (or the
\* modeled semantics) changed out from under the design document.
SPECIFICATION Spec
CONSTANTS
    PEERS = {p1, p2}
    ROOTS = {1, 2}
    MAX_SEQ = 4
    GAP = 1
    MAX_CRASHES = 2
    PARTITIONED = TRUE
INVARIANTS
    TypeOK
    NoObservableFork
PROPERTIES
    FloorMonotone
    SlotMonotone
    HeadMonotone
