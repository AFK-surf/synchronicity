\* The connected-cluster configuration at CI-sized bounds (~20 s, ~2.5 M
\* states).  Same model as Recovery.cfg with MAX_SEQ lowered by one; run
\* Recovery.cfg locally for the deeper check (~3 min, ~55 M states).
SPECIFICATION Spec
CONSTANTS
    PEERS = {p1, p2}
    ROOTS = {1, 2}
    MAX_SEQ = 3
    GAP = 1
    MAX_CRASHES = 2
    PARTITIONED = FALSE
INVARIANTS
    TypeOK
    NoObservableFork
PROPERTIES
    FloorMonotone
    SlotMonotone
    HeadMonotone
