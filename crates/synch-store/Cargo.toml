[package]
name = "synch-store"
description = "SQLite metadata store and content-addressed blob store for synchronicity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
test-utils = []

[dependencies]
async-trait.workspace = true
bao-tree.workspace = true
blake3.workspace = true
bytes.workspace = true
hex.workspace = true
iroh-base.workspace = true
opendal.workspace = true
postcard.workspace = true
range-collections.workspace = true
rusqlite.workspace = true
serde.workspace = true
synch-core.workspace = true
synch-mpt.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Filesystem capacity for the cloud cache's 20%-free floor on Unix, plus Linux
# reflink/copy-range acceleration (`docs/SERVERLESS.md` §6.3).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest.workspace = true
rustls.workspace = true
tempfile.workspace = true

[lints]
workspace = true
