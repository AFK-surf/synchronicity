[package]
name = "synch-net"
description = "iroh endpoint, mptsync and blob ALPN handlers, and the DNSSEC membership resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The simulated signed zone, transparency log and TUF repository
# (`crate::sim`). Test machinery: 1300 lines of harness that has no place in
# a shipped binary and no business being part of this crate's public API.
# Enabled below as a dev-dependency on this same crate, which is how an
# integration test in another crate reaches it without every `synch` and
# `synch-s3` build carrying it. `sim` is what marks a test build, so it also
# carries the pre-main TLS provider install test binaries need
# (`crate::tls`).
sim = []

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
ctor.workspace = true
futures-core.workspace = true
hex.workspace = true
hickory-resolver.workspace = true
iroh.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
iroh-base.workspace = true
iroh-mainline-address-lookup.workspace = true
n0-mainline.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
synch-core.workspace = true
synch-mpt.workspace = true
synch-store.workspace = true
synch-sock.workspace = true

async-trait.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# This crate's own tests need the harness; production builds do not.
synch-net = { path = ".", features = ["sim"] }
hex.workspace = true
postcard.workspace = true
time.workspace = true
synch-mpt.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
