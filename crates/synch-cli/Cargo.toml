[package]
name = "synch-cli"
description = "The synchronicity CLI and daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "synch_cli"
path = "src/lib.rs"

[[bin]]
name = "synch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fs2.workspace = true
hyper-util.workspace = true
iroh.workspace = true
iroh-base.workspace = true
prost.workspace = true
synch-cc.workspace = true
synch-core.workspace = true
synch-engine.workspace = true
synch-mpt.workspace = true
synch-net.workspace = true
synch-store.workspace = true
synch-sock.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
blake3.workspace = true
# `sim` marks a test build: it carries the pre-main TLS provider install
# test binaries need since the aws-lc-rs move (crate::tls), and the
# simulated zone/log harness.
synch-net = { workspace = true, features = ["sim"] }
synch-store.workspace = true
synch-sock.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[lints]
workspace = true
