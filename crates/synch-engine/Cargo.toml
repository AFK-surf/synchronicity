[package]
name = "synch-engine"
description = "The embeddable synchronicity node: scanner, publisher, anti-entropy, fetcher, mirrors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aws-lc-rs.workspace = true
directories.workspace = true
futures-util.workspace = true
hex.workspace = true
iroh.workspace = true
iroh-base.workspace = true
notify.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
synch-core.workspace = true
synch-mpt.workspace = true
synch-net.workspace = true
synch-sock.workspace = true

async-trait.workspace = true
synch-store.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The cloud-attach tunnel: an outbound WebSocket client, TLS through rustls.
# No server half is pulled in — the daemon dials out and never listens.
tokio-tungstenite.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# The simulated zone/log harness, for tests only.
synch-cc.workspace = true
synch-net = { workspace = true, features = ["sim"] }
iroh-base.workspace = true
synch-store.workspace = true
tempfile.workspace = true

[lints]
workspace = true
