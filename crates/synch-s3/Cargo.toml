[package]
name = "synch-s3"
description = "An S3-compatible gateway onto a synchronicity cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "synch_s3"
path = "src/lib.rs"

[[bin]]
name = "synch-s3"
path = "src/main.rs"

# No store and no engine: the gateway is a control client of the daemon
# and nothing more (§9.1, §9.4). `synch-cli` is where the control protocol
# lives (§11); `synch-core` supplies the record types the protocol carries.
[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
crc.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
synch-cli.workspace = true
synch-core.workspace = true
synch-net.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
blake3.workspace = true
crc.workspace = true
reqwest.workspace = true
synch-engine.workspace = true
# `sim` turns on the pre-main TLS provider install (`synch_net::tls`) this
# test binary needs to build its reqwest client.
synch-net = { workspace = true, features = ["sim"] }
tempfile.workspace = true

[lints]
workspace = true
