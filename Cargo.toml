[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeynepbabur/synchronicity"
authors = ["the synchronicity authors"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "allow"

[workspace.dependencies]
synch-core = { path = "crates/synch-core", version = "0.1.0" }
synch-mpt = { path = "crates/synch-mpt", version = "0.1.0" }
synch-store = { path = "crates/synch-store", version = "0.1.0" }
synch-net = { path = "crates/synch-net", version = "0.1.0" }
synch-engine = { path = "crates/synch-engine", version = "0.1.0" }
synch-cli = { path = "crates/synch-cli", version = "0.1.0" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
bao-tree = { version = "0.16.0", default-features = false, features = ["validate"] }
base64 = "0.22.1"
blake3 = "1.8.6"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
# Life-before-main, used to install the TLS provider in test builds
# (`synch_net::tls`).
ctor = "0.4"
directories = "6.0.0"
futures-core = "0.3"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
hex = "0.4.3"
hmac = "0.13.0"
hyper-util = { version = "0.1.20", features = ["tokio"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["dnssec-aws-lc-rs", "tokio"] }
iroh = { version = "1.0.3", default-features = false, features = ["tls-aws-lc-rs"] }
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
# 0.5 is the first release that takes iroh with `default-features = false`;
# on 0.4 iroh's defaults come back in and with them the ring provider.
iroh-mainline-address-lookup = "0.5.0"
n0-mainline = "0.6.0"
notify = "8.2.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
prost = "0.14.4"
proptest = "1.11.0"
protox = "0.9.1"
range-collections = "0.4.6"
# `rustls-no-provider`, not `rustls`: everything here standardizes on the
# aws-lc-rs provider (iroh `tls-aws-lc-rs`, hickory `dnssec-aws-lc-rs`), and
# the choice is made in exactly one place. A second provider pulled in by a
# dependency feature would leave rustls unable to pick a process default,
# panicking on the first TLS handshake. The provider is installed at each
# binary's entry point instead (`synch_net::tls`), and before `main` on test
# builds via `ctor`.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
# `ring-io` is what makes the key, signature and digest outputs `AsRef<[u8]>`,
# the shape the signing and hashing call sites here are written against.
aws-lc-rs = { version = "1.18.0", features = ["ring-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tempfile = "3.27.0"
time = "0.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen", "router", "server"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
