name: CI

# `push` is main-only, as in control-plane.yml: a branch with an open pull
# request already runs on `pull_request`, and both triggers firing ran the
# whole workflow twice per push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      # And the configuration that actually ships. synch-net dev-depends on
      # itself with features = ["sim"], so `--all-targets` resolves `sim` ON
      # for the whole graph and neither line above ever lints the library as
      # a released client has it. `--lib` resolves it off. `cargo doc` also
      # compiles that configuration, but rustdoc's -D warnings denies rustdoc
      # lints rather than rustc's, so dead_code and unused_imports unique to
      # the shipped build reached nobody, and clippy never saw it at all.
      # `--lib` selects library targets only, and `synch-monitor`'s 1500-line
      # `main.rs` — the trust-surface guard, the coverage guard, the whole
      # reporting path — is a *binary* target. `--bins` resolves `sim` off for
      # those too, so the shipped executables are linted as shipped.
      - run: cargo clippy --workspace --lib --bins -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No network access needed: loopback only, relays and discovery off.
      # --no-fail-fast reports every platform's failures in one round-trip.
      # synch-engine is split into `test-engine` below: its real-network,
      # real-clock integration tests alone outrun the rest of the workspace.
      # `--all-features` is a strict superset of a default-features run here —
      # optional features are all purely additive — so there's no separate one.
      - run: cargo test --workspace --all-features --all-targets --no-fail-fast --exclude synch-engine
      - run: cargo test --workspace --doc --no-fail-fast --exclude synch-engine
      # `--lib --bins` resolves synch-net's `sim` dev-feature off, testing the
      # configuration that actually ships (the run above resolves it on).
      - run: cargo test --workspace --lib --bins --no-fail-fast --exclude synch-engine
      # fanout_bomb's tests are #[ignore]d for fast local `cargo test`; CI
      # still runs them explicitly so they keep gating changes.
      - run: cargo test -p synch-mpt --test fanout_bomb --no-fail-fast -- --ignored

  test-engine:
    name: test synch-engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Split from `test`: real network + real clock per test makes this
      # crate alone slower than the rest of the workspace combined.
      - run: cargo test -p synch-engine --all-features --all-targets --no-fail-fast
      - run: cargo test -p synch-engine --doc --no-fail-fast
      - run: cargo test -p synch-engine --lib --bins --no-fail-fast

  cloud-providers:
    name: cloud CAS providers
    runs-on: ubuntu-latest
    env:
      AZURITE_ACCOUNT: devstoreaccount1
      AZURITE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO, fake-gcs-server, and Azurite
        run: |
          docker run -d --name synch-minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          mkdir -p "$RUNNER_TEMP/fake-gcs/synch-gcs"
          docker run -d --name synch-fake-gcs --network host \
            -v "$RUNNER_TEMP/fake-gcs:/data" \
            fsouza/fake-gcs-server -scheme http -port 4443 \
            -external-url http://127.0.0.1:4443
          docker run -d --name synch-azurite --network host \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck \
            --disableProductStyleUrl --disableTelemetry
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:4443/storage/v1/b >/dev/null \
              && curl -sS http://127.0.0.1:10000/devstoreaccount1 >/dev/null \
              && break
            sleep 1
          done
      - name: Create provider namespaces
        run: |
          docker run --rm --network host --entrypoint=/bin/sh minio/mc -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
            mc mb --ignore-existing local/synch-s3
          '
          docker run --rm --network host mcr.microsoft.com/azure-cli \
            az storage container create --name synch-azblob \
            --connection-string "DefaultEndpointsProtocol=http;AccountName=${AZURITE_ACCOUNT};AccountKey=${AZURITE_KEY};BlobEndpoint=http://127.0.0.1:10000/${AZURITE_ACCOUNT};"
      - name: Run the shared backend contract against all providers
        run: cargo test -p synch-store --test cloud_providers -- --nocapture
        env:
          SYNCH_TEST_CLOUD_REQUIRED: "1"
          SYNCH_TEST_S3_BUCKET: synch-s3
          SYNCH_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SYNCH_TEST_S3_REGION: us-east-1
          SYNCH_TEST_S3_ACCESS_KEY_ID: minioadmin
          SYNCH_TEST_S3_SECRET_ACCESS_KEY: minioadmin
          SYNCH_TEST_GCS_BUCKET: synch-gcs
          SYNCH_TEST_GCS_ENDPOINT: http://127.0.0.1:4443
          SYNCH_TEST_AZBLOB_CONTAINER: synch-azblob
          SYNCH_TEST_AZBLOB_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
          SYNCH_TEST_AZBLOB_ACCOUNT_NAME: devstoreaccount1
          SYNCH_TEST_AZBLOB_ACCOUNT_KEY: ${{ env.AZURITE_KEY }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  tla:
    name: tla+ (recovery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch TLC
        run: |
          curl -sSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" \
            | sha256sum -c -
      # The connected-cluster model: every invariant and property must hold.
      - name: Check the recovery guarantee
        run: |
          java -XX:+UseParallelGC -jar tla2tools.jar \
            -config specs/RecoveryCI.cfg -workers auto -deadlock specs/Recovery.tla
      # The partitioned model MUST produce the §3.4 fork counterexample.  If
      # this run ever passes, the modeled semantics drifted from what the
      # design document promises — surface that, don't celebrate it.
      - name: Confirm the documented fork is still reachable
        run: |
          if java -XX:+UseParallelGC -jar tla2tools.jar \
            -config specs/RecoveryPartitioned.cfg -workers auto -deadlock specs/Recovery.tla; then
            echo "::error::RecoveryPartitioned.cfg found no fork; §3.4's admitted limitation no longer matches the model"
            exit 1
          fi

  bench:
    name: benchmark (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A correctness check on the benchmark, not a performance gate: a shared
      # CI runner's timings are too noisy to threshold, and a benchmark nobody
      # runs rots into one that no longer compiles against the code it measures.
      # Small parameters keep it under a minute; the real numbers come from
      # running it on a machine whose scheduler you own.
      - run: cargo run --release -p synch-engine --example bench -- --files 500 --object-mib 16
