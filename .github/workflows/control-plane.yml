name: control-plane

on:
  push:
    branches: [main]
    # `crates/**` too: the Gleam suite asserts against fixtures the
    # Rust side writes, and the Rust suite asserts against fixtures
    # this side writes. A change to either half that does not run the
    # other half's tests is a format divergence nothing catches.
    paths:
      - 'control-plane/**'
      - 'crates/**'
      - '.github/workflows/control-plane.yml'
  pull_request:
    # `crates/**` too: the Gleam suite asserts against fixtures the
    # Rust side writes, and the Rust suite asserts against fixtures
    # this side writes. A change to either half that does not run the
    # other half's tests is a format divergence nothing catches.
    paths:
      - 'control-plane/**'
      - 'crates/**'
      - '.github/workflows/control-plane.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  gleam:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: control-plane }
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: control-plane/.tool-versions
          version-type: strict
          rebar3-version: "3.27.0"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: make -C csqlite
      # Ubuntu runner kernels ship Landlock in the LSM stack, so the
      # sandbox is REQUIRED to hold here: a worker that comes up
      # unconfined (or a seccomp allowlist that kills legitimate work)
      # fails the job instead of only warning to stderr in production.
      - run: CSQLITE_SMOKE_REQUIRE=1 perl csqlite/smoke.pl priv/csqlite
      - run: gleam format --check src test
      - run: gleam deps download
      - run: gleam test
      - run: gleam build

  # GitHub has no hosted OpenBSD runners, so boot one in a VM and run
  # the whole control-plane suite there: the sandbox smoke test first
  # (enforcement is unconditional on OpenBSD, so a pledge promise list
  # that is too narrow or an unveil that does not stick fails fast),
  # then the full gleam test suite, which drives the pool and store
  # through real pledged workers.
  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          usesh: true
          # Everything from ports lands under /usr/local (hence the
          # -I/-L via environment, which the Makefile appends to).
          # gmake because the Makefile uses GNU `override`; perl is in
          # base. The ports gleam is built against OTP 28, so erlang%28
          # keeps erl/escript on that major (the exact patch pin in
          # .tool-versions is a Linux-CI concern; here the point is the
          # OS).
          prepare: pkg_add gmake sqlite3 erlang%28 gleam
          run: |
            set -e
            export PATH="/usr/local/lib/erlang28/bin:$PATH"
            # The ports gleam shells out to a version-suffixed
            # `rebar3-28` (to bind rebar3 to its OTP) and no such
            # package exists. Install the official escript (3.25.x
            # supports OTP 28) as `rebar3` — escript derives its entry
            # module from the script's basename, so the file must be
            # named `rebar3` for `rebar3:main/1` to resolve — then make
            # `rebar3-28` a shim that execs it under that basename.
            ftp -o /usr/local/bin/rebar3 https://github.com/erlang/rebar3/releases/download/3.25.1/rebar3
            chmod +x /usr/local/bin/rebar3
            printf '#!/bin/sh\nexec /usr/local/bin/rebar3 "$@"\n' > /usr/local/bin/rebar3-28
            chmod +x /usr/local/bin/rebar3-28
            # Every open connection owns one csqlite process and its pipes
            # for as long as it is held, and the suite holds a good many at
            # once. OpenBSD's default login class is tighter than the Linux
            # runner's, and a suite that outgrows it fails partway through
            # with a spawn error rather than anything to do with the code.
            ulimit -n 1024 || true
            ulimit -p 512 || true
            cd control-plane
            env CFLAGS="-O2 -I/usr/local/include" LDFLAGS="-L/usr/local/lib" gmake -C csqlite
            CSQLITE_SMOKE_REQUIRE=1 perl csqlite/smoke.pl priv/csqlite
            gleam deps download
            gleam test

  web:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: control-plane/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  # The replication contract, with the tool the runbook names.
  #
  # `ops/RUNBOOK.md` tells operators to keep the primary in WAL mode, run
  # `litestream replicate`, and refresh each replica with `litestream
  # restore` into a scratch file plus an atomic rename. None of that is
  # implemented here — it is deliberately operator-owned — so nothing ran it.
  # `e2e-crossval` stands a replica up, but hands the file over with `cp`
  # after an explicit checkpoint, which is a weaker thing than the documented
  # contract in exactly the way that matters: it says nothing about a write
  # the primary made while serving.
  litestream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: control-plane/.tool-versions
          version-type: strict
          rebar3-version: "3.27.0"
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev bind9-dnsutils
      # Pinned by digest, like the TLC jar the `tla` job fetches: a smoke
      # test whose subject can change under it is not a smoke test.
      - name: Fetch litestream
        run: |
          curl -sSL -o litestream.tar.gz \
            https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.tar.gz
          echo "eb75a3de5cab03875cdae9f5f539e6aedadd66607003d9b1e7a9077948818ba0  litestream.tar.gz" \
            | sha256sum -c -
          sudo tar xzf litestream.tar.gz -C /usr/local/bin litestream
          litestream version
      - run: cd control-plane && gleam deps download
      - run: cd control-plane && ./ops/litestream-smoke.sh

  e2e-crossval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: control-plane/.tool-versions
          version-type: strict
          rebar3-version: "3.27.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-plane/e2e
      # The SPA, so `run.sh` has a real dashboard to stage into priv/web and
      # ask a *replica* for. Without it the run still passes — the check
      # degrades to comparing the two surfaces' routing — but the one
      # end-to-end proof that a replica serves the actual dashboard is the
      # point of building it here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: cd control-plane/web && npm ci && npx vite build
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev bind9-dnsutils
      - run: cd control-plane && make -C csqlite && gleam deps download
      - run: cd control-plane && ./e2e/run.sh
