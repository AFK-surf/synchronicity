name: tools image

# Builds the root Dockerfile — `synch`, `synch-s3` and `synch-dp` in one
# image — and publishes it to GHCR as
# ghcr.io/<owner>/synchronicity/tools, beside the control plane's own
# image. Pull requests build both architectures but push nothing; only
# main and tags produce images.
#
# Publishing does not wait on the smoke test. `image` pushes each
# architecture by digest as soon as it builds, `merge` assembles the
# manifest and moves the tags, and only then does `smoke` pull what was
# published and run ops/image-smoke.sh against it. The workspace suite
# already proves the code; what only running the image catches is the
# packaging — a binary for the wrong architecture, a runtime without
# ca-certificates, a data directory the service user cannot write, a
# gateway that cannot find the daemon's socket. Such a break now turns
# the workflow red after the tag has already moved, and is fixed forward
# with the next push rather than held back: an image is available the
# moment it builds, and `smoke` says whether it runs.
#
# The two triggers watch different paths, deliberately. Every push to
# main that changes the workspace has to produce an image, so `push`
# watches the sources too. A pull request pays a release build of the
# whole workspace, twice over, for a job that publishes nothing — so it
# runs only when the *image's own* definition changes, which is the
# change a reviewer cannot check by reading. A source change that breaks
# the image (a new runtime dependency, say) therefore surfaces on main.
# Run it on the pull request by hand (workflow_dispatch on the branch)
# when a change looks like it could.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'ops/image-smoke.sh'
      - '.github/workflows/tools-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'ops/image-smoke.sh'
      - '.github/workflows/tools-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/tools

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # A release build of the whole workspace, from an empty cache on the
    # first run of any changed source. That is the job, not a hang.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Signed build provenance for the pushed image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # Compile both Rust and Lean against the native target runtime.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry reference must be lowercase, and github.repository keeps
      # the owner's case — an owner spelled with capitals makes buildx
      # reject the ref outright. Workflow expressions cannot fold case, so
      # do it in the shell and use this one value everywhere below.
      # metadata-action lowercases the `images` it is handed, but the refs
      # given to buildx and to the attestation are taken verbatim.
      - id: ref
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=synchronicity tools
            org.opencontainers.image.description=The synchronicity CLI and daemon, the S3 gateway, and the cloud data plane in one image
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.ref.outputs.image) || 'type=cacheonly' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Each architecture keeps its own cache; `smoke` reads the amd64
          # scope this writes when it has to build for itself.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: tools-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      # The manifest `smoke` pulls, named by digest so it tests exactly
      # what this run published even if a later run moves the tags.
      digest: ${{ steps.manifest.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: tools-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Lowercase as in `image` above: imagetools takes this ref verbatim.
      - id: ref
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish multi-platform manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done <<< "$TAGS"
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
          # metadata-action emits one tag per line; inspect the first. A
          # doubled backslash here would leave the whole list in `first_tag`.
          first_tag=$(printf '%s\n' "$TAGS" | head -n 1)
          digest=$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Run the image that was just published. Single-architecture, because
  # the arm64 half is the same Dockerfile compiled for another target —
  # what is being tested here is packaging, not codegen.
  #
  # A pull request pushes nothing, so there is no manifest to pull and
  # this builds the amd64 half into the local daemon instead. That build
  # is nearly free: `image` has just written the amd64 cache scope it
  # reads, and it exports no cache of its own.
  smoke:
    name: smoke test the image
    needs: [image, merge]
    # `merge` is skipped on pull requests, which would skip this job with
    # it; run whenever there is something to test — a local build on a
    # pull request, a published manifest anywhere else.
    if: ${{ !cancelled() && needs.image.result == 'success' && (github.event_name == 'pull_request' || needs.merge.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request'

      - uses: docker/build-push-action@v6
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: synch-tools:smoke
          cache-from: type=gha,scope=amd64
          # The docker exporter `load: true` needs cannot carry
          # attestations; the published build makes them.
          provenance: false

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the published image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          published="${REGISTRY}/${IMAGE_NAME,,}@${DIGEST}"
          docker pull "$published"
          docker tag "$published" synch-tools:smoke

      - run: ./ops/image-smoke.sh synch-tools:smoke
